function writeMessage(label, message){

function fireAtTarget(position, canvas) {
	var img = new Image();
	img.src = 'bullet_hole.gif';
	var x = position.x;
	var y = position.y;
	var message = "";
	var context = canvas.getContext('2d');
	context.drawImage(img, x - 9, y - 9, 20, 20);
	document.getElementById("audiotag1").play();
	
	if(y >= 51 && y <= 74) {
		if((x >= 51 && x <= 78) || (x >= 185 && x <= 211)) {
			message = "bullseye";
		} else {
			message = "miss";
		}
	} else if(y >= 188 && y <= 213) {
		if(x >= 115 && x <= 142) {
			message = "bullseye";
		} else {
			message = "miss";
		}
	} else if(y >= 322 && y <= 348) {
		if((x >= 51 && x <= 78) || (x >= 185 && x <= 211)) {
			message = "bullseye";
		} else {
			message = "miss";
		}
	} else {
		message = "miss";
	}
	
	document.getElementById('myLabel').innerHTML = message + " x: " + x + " y: " + y;
}
 
function getMousePos(canvas, evt){
    // get canvas position
    var obj = canvas;
    var top = 0;
    var left = 0;
    while (obj && obj.tagName != 'BODY') {
        top += obj.offsetTop;
        left += obj.offsetLeft;
        obj = obj.offsetParent;
    }
 
    // return relative mouse position
    var mouseX = evt.clientX - left + window.pageXOffset;
    var mouseY = evt.clientY - top + window.pageYOffset;
    return {
        x: mouseX,
        y: mouseY
    };
}
 
window.onload = function(){
    var canvas = document.getElementById('myCanvas');
    var context = canvas.getContext('2d');
    var label = document.getElementById('myLabel');
 
    canvas.addEventListener('mousedown', function(evt){
        var mousePos = getMousePos(canvas, evt);
        var message = "Mouse position: " + mousePos.x + "," + mousePos.y;
        fireAtTarget(mousePos, canvas);
        //writeMessage(label, message);
    }, false);
};
</script>
